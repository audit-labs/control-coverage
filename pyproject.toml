[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-coverage"
version = "0.1.0"
description = "Control-first coverage and blind-spot analysis over an evidence corpus, with a Statement of Applicability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Audit Labs" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
control-coverage = "control_coverage.cli:main"

[project.urls]
Homepage = "https://audit-labs.dev"
Repository = "https://github.com/audit-labs/control-coverage"

[tool.setuptools]
packages = ["control_coverage", "control_coverage.reporters"]
include-package-data = true

[tool.setuptools.package-data]
# Ship the bundled framework catalogs inside the wheel so the CLI works after install.
"control_coverage" = ["catalogs/*.yaml"]
