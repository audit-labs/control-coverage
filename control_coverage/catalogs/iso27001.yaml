# COPYRIGHT: ISO/IEC 27001:2022 is copyright ISO/IEC. Only the Annex A control
# identifiers (e.g. A.5.17) and their short titles are reproduced here as labels;
# the normative control text and implementation guidance are not. For the
# authoritative wording, obtain the standard from ISO. These control-to-signal
# mappings are the maintainers' interpretation and are not reviewed or endorsed
# by ISO/IEC. See ../../MAPPING.md.
