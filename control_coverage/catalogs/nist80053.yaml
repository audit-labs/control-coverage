# NIST SP 800-53 Rev. 5 — Moderate baseline (base controls).
#
# The base controls selected in the SP 800-53B moderate impact baseline, across
# all 18 baseline-applicable families. Control enhancements (e.g. AC-2(1)) are not
# enumerated — coverage is measured at the base-control level. The program
# management (PM) family is org-wide and not baseline-allocated; the privacy (PT)
# family is selected via the separate privacy baseline. A control's full code is
# "NIST:<id>".
#
# COPYRIGHT: NIST SP 800-53 is a U.S. Government work in the public domain. The
# control-to-signal mappings, however, are the maintainers' interpretation and
# are not reviewed or endorsed by NIST. See ../../MAPPING.md.
